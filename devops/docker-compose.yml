services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/app
      TARGET_TABLE: reproceso_registros
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:

